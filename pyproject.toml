[project]
name = "eficiencia"
version = "0.1.0"
description = "Estimador de eficiência energética de veículos a partir dos dados PBEV"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "torch",
    "optuna",
    "cmaes",
    "optuna-dashboard",
    "joblib",
    "streamlit",
    "plotly",
    "matplotlib",
    "openpyxl",
]

[project.scripts]
eficiencia-limpar = "eficiencia.dados:main"
eficiencia-treinar = "eficiencia.treino:main"
eficiencia-progresso = "eficiencia.progresso:main"
eficiencia-experimento = "eficiencia.experimentos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eficiencia"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
# docs e skills são Markdown; o ruff format reescreveria os blocos de código neles
extend-exclude = ["docs", ".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
